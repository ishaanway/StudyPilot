<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Definition of gradients for modern, premium look -->
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  
  <!-- Main shape: Book page wing left -->
  <path d="M 50,75 C 38,71 20,72 15,77 L 15,32 C 20,27 38,26 50,30 Z" fill="url(#primaryGrad)" />
  
  <!-- Main shape: Book page wing right -->
  <path d="M 50,75 C 62,71 80,72 85,77 L 85,32 C 80,27 62,26 50,30 Z" fill="url(#primaryGrad)" opacity="0.9" />
  
  <!-- Middle Book Spine / Binding -->
  <path d="M 50,30 L 50,75" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  
  <!-- Spark/AI node at the top center -->
  <circle cx="50" cy="18" r="4.5" fill="url(#accentGrad)" />
  
  <!-- Light rays / Connections -->
  <line x1="50" y1="18" x2="38" y2="35" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 1" />
  <line x1="50" y1="18" x2="62" y2="35" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 1" />
  <line x1="50" y1="18" x2="50" y2="28" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  
  <!-- Small details: Sparkles inside the pages representing ideas -->
  <circle cx="32" cy="45" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="68" cy="55" r="2" fill="#ffffff" opacity="0.8" />
</svg>
